name: Docker CI/CD

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/dentist:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/dentist:latest \
            .

          docker push ${{ secrets.DOCKER_USERNAME }}/dentist:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/dentist:latest

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m

          script: |
            set -e

            docker pull ${{ secrets.DOCKER_USERNAME }}/dentist:${{ github.sha }}

            docker stop dentist || true
            docker rm dentist || true

            docker run -d \
              --name dentist \
              --restart unless-stopped \
              -p 5000:5000 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              ${{ secrets.DOCKER_USERNAME }}/dentist:${{ github.sha }}

            sleep 5

            docker ps
            docker logs dentist --tail 50

            docker image prune -f